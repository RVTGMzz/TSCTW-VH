name: Export build source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-build-source.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v07-build-source
          path: |
            translations/*.json
            src/builder/build_v07.py
            src/builder/dbpf.py
            src/builder/qfs.py
