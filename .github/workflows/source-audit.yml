name: Source Audit v0.7

on:
  push:
    branches: [main]
    paths:
      - "translations/**"
      - "castaway-english-strings.json"
      - "src/builder/**"
      - ".github/workflows/source-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run v0.7 source audit
        run: python src/builder/build_v07.py --audit-only

      - name: Print audit report
        if: always()
        run: |
          if [ -f work/build_v07/source_audit.json ]; then
            cat work/build_v07/source_audit.json
          fi
