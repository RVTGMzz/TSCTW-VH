name: Source Audit

on:
  push:
    branches: [main]
    paths:
      - "translations/**"
      - "runtime/**"
      - "castaway-english-strings.json"
      - "src/builder/**"
      - ".github/workflows/source-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run v0.7 source audit
        run: python src/builder/build_v07.py --audit-only

      - name: Print audit report
        if: always()
        run: |
          if [ -f work/build_v07/source_audit.json ]; then
            cat work/build_v07/source_audit.json
          fi


      - name: Verify safe baseline staging with synthetic package fixtures
        run: python src/builder/test_stage_runtime_inputs.py

      - name: Runtime source QA (coverage may remain incomplete)
        run: python src/builder/validate_runtime.py

      - name: Trace Castaway story selector source candidates
        run: python src/builder/trace_selector_sources.py

      - name: Print inherited review triage
        run: |
          python src/builder/triage_review_queue.py --groups 80 --samples 8
          python src/builder/triage_review_queue.py --include-unowned --groups 160 --samples 6
          python src/builder/triage_review_queue.py --include-unowned --object-contains "Memory -" --groups 280 --samples 8
          python src/builder/triage_review_queue.py --include-unowned --value-regex "reward|rewards|prize|bonus|achievement" --groups 140 --samples 18
          python src/builder/triage_review_queue.py --include-unowned --value-regex "^(examine|use|inspect|check out)([.?!/ ]|$)" --groups 120 --samples 24
          python src/builder/triage_review_queue.py --include-unowned --value-regex "^(barter|craft|gather|harvest|collect|fish|cook|store|storage|survival)([.?!/ ]|$)" --groups 120 --samples 18
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2136235661 --groups 20 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2145007292 --groups 20 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2131381400 --groups 20 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2138487677 --groups 20 --samples 180
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2141349871 --groups 20 --samples 180
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2146250052 --groups 20 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2135789311 --groups 20 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2139632840 --groups 20 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --object-contains "Chair - Living" --groups 120 --samples 220
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2147196186 --groups 20 --samples 200
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2132660664 --groups 20 --samples 160
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2133437151 --groups 20 --samples 160
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2132104824 --groups 20 --samples 160
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2137033768 --groups 20 --samples 160
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2138180871 --groups 20 --samples 160
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2144455086 --groups 20 --samples 160
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2140988335 --groups 20 --samples 260
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2146325018 --groups 40 --samples 500
          python src/builder/triage_review_queue.py --include-unowned --instance-id 2139503788 --groups 40 --samples 500
          python -c "import glob,json; ps=glob.glob('runtime/row_scope_overrides*.json')+glob.glob('runtime/row_translation_overrides*.json'); rows=[r for p in ps for r in json.load(open(p,encoding='utf-8'))]; print('PROMOTED_STAR_ROWS',sum(str(r.get('en','')).startswith('*') for r in rows))"
          python -c "import glob,json,re; ps=glob.glob('runtime/row_scope_overrides*.json')+glob.glob('runtime/row_translation_overrides*.json'); rows=[r for p in ps for r in json.load(open(p,encoding='utf-8'))]; print('PROMOTED_OPAQUE_ID_ROWS',sum(bool(re.fullmatch(r'(?:[0-9a-f]{8}|bebe[0-9a-f]+|ecdb[0-9a-f]+)',str(r.get('en','')),re.I)) for r in rows)); print('PROMOTED_DELETED_META_ROWS',sum(bool(re.search(r'(deleted|not needed|not used|unused)',str(r.get('description','')),re.I)) for r in rows))"
          python -c "import glob,json,re; ps=glob.glob('runtime/row_scope_overrides*.json')+glob.glob('runtime/row_translation_overrides*.json'); rows=[r for p in ps for r in json.load(open(p,encoding='utf-8'))]; print('PROMOTED_DEBUG_PREFIX_ROWS',sum(bool(re.match(r'^(?:DEBUG|DBG)\\b',str(r.get('en','')),re.I)) for r in rows)); print('PROMOTED_BANG_ONLY_META_ROWS',sum(bool(re.fullmatch(r'!+',str(r.get('description','')).strip())) for r in rows))"
