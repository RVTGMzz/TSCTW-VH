name: Source Audit

on:
  push:
    branches: [main]
    paths:
      - "translations/**"
      - "runtime/**"
      - "castaway-english-strings.json"
      - "src/builder/**"
      - ".github/workflows/source-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run v0.7 source audit
        run: python src/builder/build_v07.py --audit-only

      - name: Print audit report
        if: always()
        run: |
          if [ -f work/build_v07/source_audit.json ]; then
            cat work/build_v07/source_audit.json
          fi


      - name: Runtime source QA (coverage may remain incomplete)
        run: python src/builder/validate_runtime.py

      - name: Print inherited review triage
        run: |
          python src/builder/triage_review_queue.py --groups 80 --samples 8
          python src/builder/triage_review_queue.py --object-contains "CS - Food - Lomi Lomi Salmon" --groups 4 --samples 100
          python src/builder/triage_review_queue.py --object-contains "CS - Toilet - Outdoor Hut" --groups 4 --samples 100
          python src/builder/triage_review_queue.py --object-contains "CS - Birthday Cake" --groups 4 --samples 100
          python src/builder/triage_review_queue.py --object-contains "CS - Potty Chair" --groups 4 --samples 100
          python src/builder/triage_review_queue.py --object-contains "CS - High Chair - Plastic" --groups 4 --samples 100
          python src/builder/triage_review_queue.py --object-contains "Reward" --groups 120 --samples 30
          python src/builder/triage_review_queue.py --object-contains "Weather Control Device" --groups 10 --samples 100
          python src/builder/triage_review_queue.py --object-contains "Steamer Trunk" --groups 40 --samples 50
          python src/builder/triage_review_queue.py --object-contains "Hatchet" --groups 40 --samples 50
          python src/builder/triage_review_queue.py --object-contains "Pickaxe" --groups 40 --samples 50
          python src/builder/triage_review_queue.py --object-contains "Staff of Tuzu" --groups 40 --samples 50
          python src/builder/triage_review_queue.py --object-contains "Story Reward" --groups 40 --samples 50
          python src/builder/triage_review_queue.py --type-filter "CTSS" --groups 120 --samples 10
          python src/builder/triage_review_queue.py --object-contains "CS - Autumn Leaf Pile" --groups 10 --samples 100
          python src/builder/triage_review_queue.py --object-contains "CS - Pet Bed - House - Native" --groups 10 --samples 100
