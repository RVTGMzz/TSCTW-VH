name: Build Windows v0.8 TEST Installer

on:
  push:
    branches: [main]
    paths:
      - "src/builder/**"
      - "runtime/**"
      - ".github/workflows/v08-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout localization source only
        uses: actions/checkout@v4

      - name: Set up Python on GitHub runner (NOT user's PC)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all builder Python modules (catch GUI syntax errors before EXE)
        run: python -m compileall -q src/builder

      - name: Guard Windows workflow against duplicate release blocks
        run: python src/builder/test_ci_workflow_integrity.py

      - name: Run binary and delivery regression tests (synthetic game bytes)
        shell: pwsh
        run: |
          python src/builder/test_stage_runtime_inputs.py
          python src/builder/test_runtime_dbpf_writer.py
          python src/builder/test_probe_story_selector.py
          python src/builder/test_v08_delivery.py
          python src/builder/test_win_v08_installer.py
          python src/builder/test_safe_rebase_runtime.py
          python src/builder/test_aspiration_reward_family.py
          python src/builder/test_safe_core_text_overlay.py
          python src/builder/test_diagnose_selector_matrix.py
          python src/builder/test_patch_neighborhood_text.py
          python src/builder/test_reviewed_migration_source.py
          python src/builder/smoke_frozen_v08.py

      - name: Verify actual bundled localization source coverage
        run: python src/builder/validate_runtime.py

      - name: Install EXE packager on GitHub runner only
        run: python -m pip install "pyinstaller==6.16.0"

      - name: Build single Windows EXE with embedded runtime translations and GUI
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "VotriValley-Castaway-v08-TEST" `
            --paths "src/builder" `
            --add-data "runtime;runtime" `
            --add-data "translations;translations" `
            --add-data "castaway-english-strings.json;." `
            --hidden-import "tkinter" `
            --hidden-import "tkinter.filedialog" `
            --hidden-import "tkinter.messagebox" `
            --hidden-import "tkinter.scrolledtext" `
            "src/builder/win_v08_installer.py"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller packaging FAILED" }

      - name: Smoke-test FROZEN Windows EXE, bundled source, no game required
        shell: pwsh
        run: |
          $file = Resolve-Path ".\dist\VotriValley-Castaway-v08-TEST.exe"
          $process = Start-Process -FilePath $file -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "EXE --self-test returned $($process.ExitCode)" }
          $bytes = (Get-Item $file).Length
          if ($bytes -lt 5000000) { throw "Unexpectedly small EXE, likely missing PyInstaller assets: $bytes" }
          Write-Output "Frozen executable self-test PASS ($bytes bytes)."
          if ((Get-ChildItem dist -Recurse -Include "*.package" -File).Count -gt 0) {
            throw "Commercial game package unexpectedly included in dist"
          }

      - name: Verify portable EXE checksum and commit identity
        shell: pwsh
        run: |
          $file = '.\dist\VotriValley-Castaway-v08-TEST.exe'
          if (!(Test-Path $file)) { throw 'No packaged EXE' }
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          if ($hash.Length -ne 64) { throw 'Invalid EXE SHA256' }
          $version = '${{ github.sha }}'
          @(
            'Castaway v0.8 TEST - checksum for this GitHub Actions build'
            "Commit: $version"
            "SHA256: $hash"
            'Filename: VotriValley-Castaway-v08-TEST.exe'
            'Important: frozen synthetic smoke only; in-game behavior unverified.'
          ) | Set-Content -Path dist/BUILD-IDENTITY.txt -Encoding utf8
          Write-Output "EXE SHA256: $hash at commit $version"

      - name: Write clear TEST caveats for user
        shell: pwsh
        run: |
          @'
          VOTRI VALLEY - THE SIMS CASTAWAY STORIES v0.8 TEST
          Open VotriValley-Castaway-v08-TEST.exe and click "Cài Việt hóa v0.8 TEST".
          No Python or extra installer prerequisites on the user's PC.
          This is a runtime Text/catalog overlay with an exact-row N001/N002 installed-template selector patch, for an existing working v0.7a installation with RonVN font.
          The app verifies all 10 input packages; prepatched packages must pass exact row/resource/language compatibility checks and are backed up,
          and refuses unsafe writes. It will NOT alter Documents save data.
          Unknown/corrupt/incompatible runtime modifications always stop safely without overwriting files.
          This build passed synthetic tests, NOT yet verified against the user's real game.
          Story Selector runtime read path remains unverified.
          Restore via "Khôi phục bản trước" in the same app after closing the game.
          '2026-10-09: pre-release TEST; Votri Valley'
          '@ | Set-Content -Path dist/README-V08-TEST.txt -Encoding utf8
      - name: Provide standalone EXE download
        uses: actions/upload-artifact@v4
        with:
          name: VotriValley-Castaway-v08-TEST-Windows
          path: |
            dist/VotriValley-Castaway-v08-TEST.exe
            dist/README-V08-TEST.txt
            dist/BUILD-IDENTITY.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish direct EXE as clearly marked experimental prerelease
        # Some repositories deny GITHUB_TOKEN release writes (HTTP 403).
        # Keep the successfully smoke-tested EXE available via Actions artifact.
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "castaway-v08-test-windows-${{ github.run_number }}"
          $notes = "Votri Valley - The Sims Castaway Stories v0.8 TEST (Windows). Download EXE and double-click; no Python required. EXPERIMENTAL: only synthetic source/DBPF tests passed, real game packages and gameplay are not yet verified. Runtime overlay requires an existing functional v0.7a Text/font setup, verifies originals by SHA-256 or validates previously patched DBPF rows and metadata before backup/patch. May patch exact verified N001/N002 installation-template text, but never Documents saves. Restorable using the same EXE."
          gh release create $tag "dist/VotriValley-Castaway-v08-TEST.exe" "dist/README-V08-TEST.txt" "dist/BUILD-IDENTITY.txt" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Castaway Stories Viet hoa v0.8 TEST - Windows build ${{ github.run_number }}" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease creation failed" }
